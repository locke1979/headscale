services:
  tailscale-mcp:
    build:
      context: .
      args:
        TAILSCALE_MCP_VERSION: "1.3.4"
    image: locke1979/tailscale-mcp-server:1.3.4
    stdin_open: true
    tty: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TAILSCALE_API_KEY: ${TAILSCALE_API_KEY:?Set TAILSCALE_API_KEY in the environment}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET:--}
      TAILSCALE_ALLOWED_TOOL_RISK: ${TAILSCALE_ALLOWED_TOOL_RISK:-read}
